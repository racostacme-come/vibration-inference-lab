name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/check_results.py
      - run: python scripts/build_paper.py --verify
      - run: python -m build
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import quantflex; assert 'site-packages' in quantflex.__file__"
          python -m pytest -q
          python scripts/check_results.py
          python examples/quickstart.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-science texlive-fonts-recommended lmodern poppler-utils
      - run: python scripts/build_paper.py
      - run: python scripts/build_paper.py --verify
      - run: mkdir -p paper/build && pdftoppm -scale-to 1400 -png paper/paper.pdf paper/build/page
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-review
          path: |
            paper/paper.pdf
            paper/build-report.json
            paper/build/page-*.png
