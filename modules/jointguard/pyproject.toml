[build-system]
requires = ["scikit-build-core>=0.11,<1", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "jointguard"
version = "0.1.0"
description = "Joint forecast diagnostics and extension risk for elastic systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "pypdf>=5,<7", "pybind11>=3,<4", "clang-format==23.1.3"]

[project.scripts]
jointguard = "jointguard.study:main"

[tool.scikit-build]
wheel.packages = ["src/jointguard"]
cmake.build-type = "Release"
sdist.include = ["paper/paper.pdf", "paper/build-report.json", "results/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
