name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]" pybind11
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/bindings.cpp cpp/state.hpp cpp/test_state.cpp
      - run: python -m pytest -q
      - run: python scripts/check_samples.py
      - run: python -m build
      - name: Configure native tests
        shell: bash
        run: cmake -S . -B build/native -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils
      - run: python -m pip install "pypdf>=5,<7"
      - run: python scripts/build_paper.py
      - run: pdftoppm -scale-to 1400 -png paper/paper.pdf paper/build/page
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-validation
          path: |
            paper/paper.pdf
            paper/validation.json
            paper/build/*.png
            paper/build/paper.log
