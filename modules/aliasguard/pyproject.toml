[build-system]
requires = ["scikit-build-core>=0.11,<1", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "aliasguard"
version = "0.1.0"
description = "Streaming FIR decimation and analytical alias budgets for vibration signals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "pypdf>=5,<7", "clang-format==23.1.3"]

[project.scripts]
aliasguard = "aliasguard.cli:main"

[tool.scikit-build]
wheel.packages = ["src/aliasguard"]
cmake.build-type = "Release"
sdist.include = ["paper/paper.pdf", "paper/validation.json", "examples/results/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 96
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
