name: Validate implementation and manuscript
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: C++ formatting
        shell: bash
        run: clang-format --dry-run --Werror cpp/*.cpp cpp/*.hpp
      - run: cmake -S . -B build/native -DALIASGUARD_PYTHON=OFF
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: python -m pytest -q
      - run: python scripts/check_samples.py
      - run: python scripts/check_manifest.py
      - run: python -m build
      - name: Installed wheel checks
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import aliasguard; assert 'site-packages' in aliasguard.__file__, aliasguard.__file__"
          python -m pytest -q
          aliasguard --help
      - name: Native memory and undefined-behavior checks
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/sanitize -DALIASGUARD_PYTHON=OFF -DALIASGUARD_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/sanitize
          ctest --test-dir build/sanitize --output-on-failure
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended poppler-utils
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_manifest.py
      - run: python paper/build.py --engine pdflatex
      - run: python scripts/check_manifest.py
      - run: pdftoppm -r 110 -png paper/paper.pdf paper/build/page
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: checked-manuscript
          path: |
            paper/paper.pdf
            paper/validation.json
            paper/build/*.png
            paper/build/*.log
